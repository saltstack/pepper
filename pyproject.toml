[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-pepper"
description = "A CLI front-end to a running salt-api system"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Seth House", email = "shouse@saltstack.com"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version"]

[project.optional-dependencies]
# Only Pepper.req_get(), Pepper.req_stream() and kerberos logins use requests.
requests = ["requests"]
kerberos = ["requests-gssapi>=1.1.0"]
# --out=yaml without salt installed
yaml = ["PyYAML"]

[project.scripts]
pepper = "pepper.script:main"

[project.urls]
Homepage = "https://github.com/saltstack/pepper"
Issues = "https://github.com/saltstack/pepper/issues"

[tool.setuptools]
packages = ["pepper"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--showlocals --log-file /tmp/pepper-runtests.log --show-capture=no -ra"
testpaths = ["tests"]
norecursedirs = [".git", ".nox"]
usefixtures = ["pepperconfig"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ensure_newline_before_comments=true
known_third_party = [
  "pytest"
]

[tool.towncrier]
    package = "pepper"
    filename = "CHANGELOG.md"
    directory = "changelog/"
    template = "changelog/.template.jinja"
    start_string = "# Changelog\n"
    underlines = ["", "", ""]
    title_format = "## {version} ({project_date})"
    issue_format = "[#{issue}](https://github.com/saltstack/pepper/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "removed"
        name = "Removed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecated"
        name = "Deprecated"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "changed"
        name = "Changed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "fixed"
        name = "Fixed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "added"
        name = "Added"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "security"
        name = "Security"
        showcontent = true
