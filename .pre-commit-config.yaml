---
minimum_pre_commit_version: 3.5.0
repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict  # Check for files that contain merge conflict strings.
      - id: trailing-whitespace   # Trims trailing whitespace.
        args:
          - --markdown-linebreak-ext=md
      - id: mixed-line-ending     # Replaces or checks mixed line ending.
        args:
          - --fix=lf
      - id: end-of-file-fixer     # Makes sure files end in a newline and only a newline.
      - id: check-ast             # Simply check whether files parse as valid python.
      - id: check-case-conflict   # Check for files with names that would conflict on a
                                  # case-insensitive filesystem like MacOS HFS+ or Windows FAT.
      - id: check-json            # Attempts to load all json files to verify syntax.
      - id: check-symlinks        # Checks for symlinks which do not point to anything.
      - id: debug-statements      # Check for debugger imports and breakpoint() calls in python source.
      - id: fix-byte-order-marker # removes UTF-8 byte order marker
      - id: forbid-submodules     # forbids any submodules in the repository.
      - id: fix-encoding-pragma   # Remove `# -*- coding: utf-8 -*-` from the top of python files.
        args:
          - --remove

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Check for duplicate keys in pre-commit config
        files: ^\.pre-commit-config\.yaml$
        args:
          - -d
          - "{rules: {key-duplicates: enable}}"

  # ----- Code Formatting ------------------------------------------------------------------------------------------->
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: Upgrade code to Py3.10+
        args: [--py310-plus, --keep-mock]

  - repo: https://github.com/saltstack/pre-commit-remove-import-headers
    rev: 1.1.0
    hooks:
      - id: remove-import-headers

  - repo: https://github.com/saltstack/salt-rewrite
    # Automatically rewrite code with known rules
    rev: 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-docstrings
        name: Pepper docstrings auto-fixes
        files: ^pepper/.*\.py$
        args: [--silent, -F, fix_docstrings]

  - repo: https://github.com/timothycrosley/isort
    rev: 5.13.2
    hooks:
      - id: isort
        additional_dependencies: ['toml']

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.16.0
    hooks:
      - id: blacken-docs
        args: [--skip-errors]
        files: ^README\.rst$
        additional_dependencies:
          - black==24.2.0
  # <---- Code Formatting --------------------------------------------------------------------------------------------

  # ----- Security -------------------------------------------------------------------------------------------------->
  - repo: https://github.com/PyCQA/bandit
    rev: "1.7.7"
    hooks:
      - id: bandit
        alias: bandit-pepper
        name: Run bandit against Pepper
        args: [--silent, -lll, --skip, "B701,B324"]
        exclude: ^tests/.*
        additional_dependencies: ['importlib_metadata<5']
  - repo: https://github.com/PyCQA/bandit
    rev: "1.7.7"
    hooks:
      - id: bandit
        alias: bandit-tests
        name: Run bandit against the test suite
        args: [--silent, -lll, --skip, "B701,B324"]
        files: ^tests/.*
        additional_dependencies: ['importlib_metadata<5']
  # <---- Security ---------------------------------------------------------------------------------------------------

  # ----- Lint ------------------------------------------------------------------------------------------------------>
  - repo: local
    hooks:
      - id: lint-pepper
        name: Lint Pepper
        entry: pylint --rcfile=.pylintrc --disable=I
        language: python
        files: ^(noxfile\.py|pepper/.*\.py)$
        additional_dependencies: &lint_deps
          - pylint==3.1.1
          - astroid==3.1.0
          - saltpylint==2024.2.5

      - id: lint-tests
        name: Lint Tests
        entry: pylint --rcfile=.pylintrc --disable=I
        language: python
        files: ^tests/.*\.py$
        additional_dependencies: *lint_deps
  # <---- Lint -------------------------------------------------------------------------------------------------------
