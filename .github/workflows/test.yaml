name: test
on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit install
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: test ${{ matrix.py }} - ${{ matrix.netapi }} - ${{ matrix.salt }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        netapi:
          - "cherrypy"
          - "tornado"
        salt:
          - "v3006.30"
          - "v3007.17"
          - "v3008.5"
          - "master"
        exclude:
          # The test minion never completes authentication with Salt 3006 on
          # Python 3.12+ or Salt 3007 on Python 3.13. Salt 3007 on Python 3.12
          # usually passes, but the minion intermittently fails to start or
          # stops answering.
          - py: "3.12"
            salt: "v3006.30"
          - py: "3.13"
            salt: "v3006.30"
          - py: "3.12"
            salt: "v3007.17"
          - py: "3.13"
            salt: "v3007.17"
    env:
      SALT_REQUIREMENT: ${{ matrix.salt == 'master' && 'salt@git+https://github.com/saltstack/salt.git@master' || format('salt=={0}', matrix.salt) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.py }}

      - name: Install setuptools_scm
        run: python -m pip install setuptools_scm

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y libc6-dev libffi-dev gcc git openssh-server libzmq3-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Nox
        run: |
          python -m pip install --upgrade pip
          pip install nox

      - name: Install Test Requirements
        env:
          PYTHON_VERSIONS: ${{ matrix.py }}
          API_BACKEND: ${{ matrix.netapi }}
        run: |
          nox --force-color -e tests --install-only

      - name: Test
        env:
          PYTHON_VERSIONS: ${{ matrix.py }}
          API_BACKEND: ${{ matrix.netapi }}
          SKIP_REQUIREMENTS_INSTALL: YES
        run: |
          nox --force-color -e tests -- -vv tests/
